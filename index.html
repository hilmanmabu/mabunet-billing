    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '08999999977', email: 'hilman@mabunet.com', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },

    function App() {
      const [admins, setAdmins] = useState(INITIAL_ADMINS);

      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());

      const [filterBlock, setFilterBlock] = useState('Semua Blok');
      
      const [dueSearchTerm, setDueSearchTerm] = useState(''); // State pencarian tagihan belum lunas

      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]); 
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      const [printData, setPrintData] = useState(null);
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      
      const [formData, setFormData] = useState({ name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '', pppoe_user: '' });
      const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: 'Belanja', description: '', notes: '', amount: '' });

      const [cropState, setCropState] = useState({ isOpen: false, src: null, isTarget: false, zoom: 1, x: 0, y: 0 });

      const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const writeLog = async (actionDesc) => {
        if(!db || !currentUser) return;
        try {
          await addDoc(collection(db, 'logs'), { 
            time: new Date().getTime(), 
            dateStr: new Date().toLocaleString('id-ID'),
            admin: currentUser.name, 
            action: actionDesc 
          });
        } catch(e) {}
      };

      useEffect(() => {
        if (!db) { setIsDbLoading(false); return; }
        try {
          const unsubAdmins = onSnapshot(collection(db, 'admins'), (snapshot) => {
            if (snapshot.empty) {
              INITIAL_ADMINS.forEach(async (adm) => { await setDoc(doc(db, 'admins', adm.id), adm); });
            } else {
              const cloudAdmins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAdmins(cloudAdmins);
              const sessionUid = localStorage.getItem('mabunet_session');
              setCurrentUser(prevUser => {
                const activeUid = prevUser ? prevUser.id : sessionUid;
                if (activeUid) {
                  const activeUser = cloudAdmins.find(a => a.id === activeUid);
                  if (activeUser && activeUser.status === 'Aktif') return activeUser;
                  else localStorage.removeItem('mabunet_session'); 
                }
                return null;
              });
            }
          });
          const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => (a.block || '').localeCompare(b.block || ''));
            setCustomers(data); setIsDbLoading(false);
          });
          const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => new Date(b.date) - new Date(a.date));
            setExpenses(data);
          });
          const unsubLogs = onSnapshot(collection(db, 'logs'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => b.time - a.time); 
            setAuditLogs(data);
          });
          return () => { unsubAdmins(); unsubCustomers(); unsubExpenses(); unsubLogs(); };
        } catch(e) { console.error(e); setIsDbLoading(false); }
      }, []);

      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
        writeLog(isPaid ? `Membatalkan lunas tagihan: ${cust.name}` : `Menandai LUNAS tagihan: ${cust.name}`);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { 
          await updateDoc(doc(db, 'customers', editingCustomer.id), formData); 
          writeLog(`Mengedit data pelanggan: ${formData.name}`);
        } else { 
          await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); 
          writeLog(`Menambah pelanggan baru: ${formData.name}`);
        }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        if (editingExpense) {
          // Mode Edit: Update data yang sudah ada di Firebase
          await updateDoc(doc(db, 'expenses', editingExpense.id), { ...expenseForm });
          writeLog(`Mengedit kas keluar (${expenseForm.category}): ${formatIDR(expenseForm.amount)}`);
        } else {
          // Mode Tambah Baru
          await addDoc(collection(db, 'expenses'), { ...expenseForm, admin: currentUser.name });
          writeLog(`Mencatat kas keluar (${expenseForm.category}): ${formatIDR(expenseForm.amount)}`);
        }
        setIsExpenseModalOpen(false);
        setEditingExpense(null); // Bersihkan state setelah disimpan
      };

      const handleDeleteCustomer = async (id) => {
        const cust = customers.find(c => c.id === id);
        if(confirm("Yakin hapus pelanggan ini?")) {
          await deleteDoc(doc(db, 'customers', id));
          writeLog(`Menghapus pelanggan: ${cust.name}`);
        }
      };

      const handleDeleteExpense = async (id) => {
        if(confirm("Yakin hapus catatan pengeluaran ini?")) {
          await deleteDoc(doc(db, 'expenses', id));
          writeLog(`Menghapus data pengeluaran (ID: ${id})`);
        }
      };

      const toggleIsolirManual = async (cust) => {
        if(confirm(`Yakin ingin ${cust.status === 'Aktif' ? 'MENGISOLIR' : 'MENGAKTIFKAN'} internet pelanggan ${cust.name}?`)) {
          const newStatus = cust.status === 'Aktif' ? 'Non-Aktif' : 'Aktif';
          await updateDoc(doc(db, 'customers', cust.id), { status: newStatus });
          writeLog(`${newStatus === 'Aktif' ? 'Mengaktifkan' : 'Mengisolir'} manual: ${cust.name}`);
        }
      };

      const handleLogin = (e) => {
        if(e) e.preventDefault();
        setLoginError('');
        const user = admins.find(a => a.username === loginForm.username && a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun Anda dinonaktifkan.');
          setCurrentUser(user); setEditProfile(user);
          localStorage.setItem('mabunet_session', user.id); 
          localStorage.setItem('mabunet_device_user', user.id); 
        } else { setLoginError('Username atau Password salah!'); }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('mabunet_session');
      };

      const registerFingerprint = async () => {
        try {
          if (!window.PublicKeyCredential) throw new Error("Perangkat tidak mendukung Fingerprint.");
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
          const pubKey = {
            challenge, rp: { name: "MABUNET", id: window.location.hostname },
            user: { id: userId, name: editProfile.username, displayName: editProfile.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000, attestation: "none"
          };
          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setEditProfile({...editProfile, credentialId: credentialId, fingerprintEnabled: true});
          alert("Sidik Jari terkait! Tekan 'Simpan Profil'.");
        } catch (err) { alert("Gagal mengaktifkan sidik jari."); }
      };

      const handleFingerprintScan = async () => {
        setIsScanning(true); setLoginError('');
        try {
          const savedUserId = localStorage.getItem('mabunet_device_user');
          if (!savedUserId) throw new Error('Perangkat belum dikenali. Login Manual dahulu lalu seting di Profil.');
          const savedUser = admins.find(a => a.id === savedUserId);
          if (!savedUser || savedUser.status !== 'Aktif') throw new Error('Akun dinonaktifkan atau hilang.');
          if (!savedUser.fingerprintEnabled || !savedUser.credentialId) throw new Error('Sidik Jari belum diaktifkan.');
          
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const rawId = Uint8Array.from(atob(savedUser.credentialId), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required" }
          });
          if (assertion) { 
            setCurrentUser(savedUser); 
            setEditProfile(savedUser);
            localStorage.setItem('mabunet_session', savedUser.id);
          }
        } catch (err) { setLoginError(err.message || 'Verifikasi Sidik Jari gagal.'); } finally { setIsScanning(false); }
      };

      const handlePhotoUploadInit = (e, isTargetAdmin = false) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setCropState({ isOpen: true, src: reader.result, isTarget: isTargetAdmin, zoom: 1, x: 0, y: 0 });
          };
          reader.readAsDataURL(file);
        }
        e.target.value = null; 
      };

      const handleCropDragStart = (e) => {
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setDragStart({ x: clientX - cropState.x, y: clientY - cropState.y });
      };
      
      const handleCropDragMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setCropState(prev => ({ ...prev, x: clientX - dragStart.x, y: clientY - dragStart.y }));
      };
      
      const handleCropDragEnd = () => setIsDragging(false);

      const applyCrop = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 400; canvas.height = 400;
          const ctx = canvas.getContext('2d');
          
          const minDim = Math.min(img.width, img.height);
          const scale = (400 / minDim) * cropState.zoom;
          const scaledW = img.width * scale;
          const scaledH = img.height * scale;
          
          const dx = (400 - scaledW) / 2 + (cropState.x * 2);
          const dy = (400 - scaledH) / 2 + (cropState.y * 2);

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, 400, 400);
          ctx.drawImage(img, dx, dy, scaledW, scaledH);

          const finalDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          if (cropState.isTarget) {
            setTargetAdmin({ ...targetAdmin, photo: finalDataUrl });
          } else {
            setEditProfile({ ...editProfile, photo: finalDataUrl });
          }
          setCropState({ ...cropState, isOpen: false });
        };
        img.src = cropState.src;
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();

      const toggleAdminStatus = async (adminId, currentStatus) => {

      const exportCSV = (type) => {
        let csv = '';

          csv = 'Nama,Blok,Paket,Harga,Status\n';
          customers.forEach(c => csv += `${c.name},${c.block},${getPackage(c.packageId).speed},${getPackage(c.packageId).price},${c.status}\n`);

          csv = 'Tanggal,Kategori,Uraian,Nominal,Admin\n';
          expenses.forEach(e => csv += `${e.date},${e.category},${e.description},${e.amount},${e.admin}\n`);
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);

      const triggerPrint = (cust) => {
        setPrintData(cust);
        setTimeout(() => { window.print(); setPrintData(null); }, 300);
      };

      const sendWAInvoice = (cust) => {
        if (!cust.phone) return alert("Nomor HP pelanggan belum diisi!");
        const pkg = getPackage(cust.packageId);
        const text = `*TAGIHAN MABUNET*\nYth. Bapak/Ibu: *${cust.name}* (Blok ${cust.block})\nBulan: *${MONTHS[selectedMonth]} ${selectedYear}*\nTagihan: *${formatIDR(pkg.price)}*\nJatuh Tempo: *Tgl ${cust.dueDate}*\n\nMohon bayar tagihan internet Anda. Abaikan pesan ini jika sudah lunas.\n\nInfo & CS: wa.me/62811122699`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const sendWAReceipt = (cust, periodKey) => {
        if (!cust.phone) return alert("Nomor HP pelanggan belum diisi!");
        const pkg = getPackage(cust.packageId);
        const text = `*KUITANSI MABUNET*\nYth. Bapak/Ibu: *${cust.name}* (Blok ${cust.block})\n\nTerima kasih, pembayaran internet untuk bulan *${MONTHS[selectedMonth]} ${selectedYear}* sebesar *${formatIDR(pkg.price)}* telah kami terima dan berstatus *LUNAS*.\n\nInfo & CS: wa.me/62811122699`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };
      
      // ---- KALKULASI DATA GLOBAL ----
      const activeCustomersList = customers.filter(c => c.status === 'Aktif');
      const dueCustomers = activeCustomersList.filter(c => !c.payments || !c.payments[currentPeriodKey]).sort((a, b) => a.dueDate - b.dueDate);
      const customersDueToday = dueCustomers.filter(c => c.dueDate === todayDay);
      
      const filteredDueCustomers = dueCustomers.filter(c => 
        (c.name || '').toLowerCase().includes(dueSearchTerm.toLowerCase()) || 
        (c.block || '').toLowerCase().includes(dueSearchTerm.toLowerCase())
      );
      
      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const actualPaidRevenue = activeCustomersList.filter(c => c.payments && c.payments[currentPeriodKey]).reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      
      const currentMonthExpenses = expenses.filter(e => e.date && e.date.startsWith(currentPeriodKey));
      
      const jurnalExpenses = currentMonthExpenses.filter(e => ['Belanja', 'Perbaikan/Pemasangan', 'Operasional'].includes(e.category));
      const famExpenses = currentMonthExpenses.filter(e => e.category === 'Fam');
      
      const totalJurnal = jurnalExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const totalFam = famExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const totalExpenseAmount = totalJurnal + totalFam; 
      
      const netProfit = actualPaidRevenue - totalExpenseAmount; 
      
      const displayedExpenses = ledgerTab === 'Jurnal' ? jurnalExpenses : famExpenses;

      const filteredCustomers = customers.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : (c.notes || '').includes(filterBlock) || c.block.includes(filterBlock);
        return matchSearch && matchBlock;
      });

      useEffect(() => { if (alarmEnabled && customersDueToday.length > 0) audioRef.current.play().catch(e => console.log(e)); }, [alarmEnabled, customersDueToday.length]);

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-100 via-slate-200 to-slate-200 dark:from-slate-800 dark:via-slate-950 dark:to-slate-950 transition-colors duration-300">
            <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-300 dark:border-slate-800 p-8 md:p-10 rounded-3xl max-w-md w-full shadow-2xl relative overflow-hidden my-8">
              <div className="absolute -top-20 -right-20 w-40 h-40 md:w-56 md:h-56 bg-indigo-600/20 blur-3xl rounded-full"></div>
              {!db && ( <div className="mb-4 p-2 bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-xs md:text-sm rounded-lg text-center font-bold">⚠️ KONEKSI FIREBASE TERGANGGU. COBA REFRESH.</div> )}
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-4 right-4 md:top-6 md:right-6 text-slate-500 hover:text-indigo-500 transition-colors">
                {isDarkMode ? <Sun className="w-5 h-5 md:w-6 md:h-6"/> : <Moon className="w-5 h-5 md:w-6 md:h-6"/>}
              </button>

              <div className="text-center mb-6 md:mb-8 relative z-10 flex flex-col items-center">
                <img src="./mabunetlogo.png" alt="MABUNET Logo" className="w-28 h-28 md:w-36 md:h-36 object-contain mb-4 drop-shadow-[0_0_15px_rgba(79,70,229,0.4)]" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-800 dark:text-white">MABU<span className="text-indigo-600 dark:text-indigo-400">NET</span></h1>
                <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1 uppercase font-semibold">Real-time Cloud Gateway</p>
              </div>

              {loginError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs md:text-sm rounded-xl flex items-center gap-2"><ShieldAlert className="w-4 h-4 md:w-5 md:h-5"/> {loginError}</div>}

              <form onSubmit={handleLogin} className="space-y-4 md:space-y-5 relative z-10 mt-6">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 md:pl-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><User className="w-4 h-4 md:w-5 md:h-5" /></div>
                  <input type="text" placeholder="Username (misal: admin2)" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-10 md:pl-12 pr-3 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                </div>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 md:pl-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><Lock className="w-4 h-4 md:w-5 md:h-5" /></div>
                  <input type={showPassword ? "text" : "password"} placeholder="Password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-10 md:pl-12 pr-10 md:pr-12 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-3 md:pr-4 flex items-center text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400">
                    {showPassword ? <EyeOff className="w-4 h-4 md:w-5 md:h-5"/> : <Eye className="w-4 h-4 md:w-5 md:h-5"/>}
                  </button>
                </div>
                <div className="flex justify-end">
                  <button type="button" onClick={() => alert('Silakan hubungi Super Admin (Hilman) untuk mereset password Anda.')} className="text-[11px] md:text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Lupa Password?</button>
                </div>
                <button type="submit" className="w-full py-2.5 md:py-3 rounded-xl bg-indigo-600 text-white text-sm md:text-base font-bold shadow-lg hover:bg-indigo-700 transition-colors">Masuk Aplikasi</button>
              </form>

              <div className="w-full border-t border-slate-300 dark:border-slate-800 my-6 md:my-8 relative z-10"><span className="absolute left-1/2 -translate-x-1/2 -top-2.5 md:-top-3 bg-white dark:bg-slate-900 px-2 text-xs md:text-sm text-slate-500 font-semibold transition-colors">ATAU</span></div>

              <div className="mt-2 md:mt-4 flex flex-col items-center relative z-10">
                <button onClick={() => handleFingerprintScan()} disabled={isScanning} className="relative group flex flex-col items-center gap-2 md:gap-3">
                  <div className={`w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center border transition-all overflow-hidden relative ${isScanning ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-600 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                    <Fingerprint className={`w-7 h-7 md:w-8 md:h-8 ${isScanning ? 'opacity-50' : ''}`} strokeWidth={isScanning ? 2 : 1.5} />
                    {isScanning && <div className="scanner-line"></div>}
                  </div>
                  <span className={`text-[10px] md:text-xs font-semibold text-center ${isScanning ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400'}`}>
                    {isScanning ? 'Memindai...' : 'Login Sidik Jari Asli'} <br/> <span className="font-normal text-[8px] md:text-[10px] opacity-70">(Ingat Perangkat Saya)</span>

                </button>

            </div>

          {printData && (

                <p style={{margin: '0', fontSize: '10px'}}>Internet RT & Network</p>
              </div>
              <p style={{margin: '2px 0'}}>Tgl : {new Date().toLocaleDateString('id-ID')}</p>
              <p style={{margin: '2px 0'}}>Opr : {currentUser.name}</p>
              <p style={{margin: '2px 0'}}>Plg : {printData.name} ({printData.block})</p>
              <p style={{margin: '2px 0'}}>Paket: {getPackage(printData.packageId).speed}</p>
              <p style={{margin: '2px 0'}}>Bulan: {MONTHS[selectedMonth]} {selectedYear}</p>

                <p style={{margin: '0'}}>Telah Berlangganan</p>
                <p style={{margin: '0'}}>MABUNET</p>
              </div>
            </div>

            <div className="flex items-center gap-3 w-1/4">

              <button onClick={() => {setActiveTab('dashboard'); setIsEditingProfile(false);}} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}`}>
                <LayoutDashboard className="w-4 h-4" /> Dashboard

              <button onClick={() => {setActiveTab('customers'); setIsEditingProfile(false);}} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'customers' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}`}>

              </button>
              <button onClick={() => {setActiveTab('ledger'); setIsEditingProfile(false);}} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}`}>
                <BookOpen className="w-4 h-4" /> Buku Kas
              </button>
              <button onClick={() => {setActiveTab('settings'); setEditProfile(currentUser); setShowPassword(false);}} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}`}>
                <Settings className="w-4 h-4" /> Pengaturan & Profil
              </button>
            </nav>

            {/* Tombol Kanan (Profil Admin, Theme, Status Server, Logout) */}
            <div className="flex items-center justify-end gap-3 w-1/4">
              <div className="hidden md:flex items-center gap-2 mr-1">
                <div className="flex flex-col text-right">
                  <span className="text-xs font-bold text-slate-800 dark:text-slate-100 leading-none">{currentUser.name}</span>
                  <span className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">{currentUser.username}</span>
                </div>
                {currentUser.photo ? (
                  <img src={currentUser.photo} className="w-9 h-9 rounded-full object-cover border border-slate-300 dark:border-slate-600" />
                ) : (
                  <User className="w-9 h-9 p-1.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-500" />
                )}
              </div>
              <div className="hidden xl:flex items-center gap-1.5 px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs font-medium text-slate-500 ml-2 border border-slate-200 dark:border-slate-700">
                {db ? <Server className="w-4 h-4 text-emerald-500" /> : <Server className="w-4 h-4 text-rose-500 animate-pulse" />}
                <span>{db ? 'Cloud' : 'Offline'}</span>
              </div>
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-slate-500 hover:text-indigo-500 transition-colors">
                {isDarkMode ? <Sun className="w-5 h-5"/> : <Moon className="w-5 h-5"/>}
              </button>
              <button onClick={handleLogout} className="flex items-center gap-1.5 px-3 py-2 bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 rounded-xl hover:bg-rose-100 dark:hover:bg-rose-500/20 text-xs md:text-sm font-bold transition-colors">
                <LogOut className="w-4 h-4"/>
              </button>
            </div>
          </header>

          {/* Menu Mobile (Bawah khusus layar HP kecil) */}
          <nav className="lg:hidden fixed bottom-0 inset-x-0 h-16 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 z-50 flex items-center justify-around px-2 shadow-[0_-4px_20px_rgba(0,0,0,0.1)] transition-colors">
            <button onClick={() => {setActiveTab('dashboard'); setIsEditingProfile(false);}} className={`flex flex-col items-center justify-center p-2 rounded-xl ${activeTab === 'dashboard' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
              <LayoutDashboard className="w-5 h-5" />
              <span className="text-[10px] mt-0.5">Home</span>
            </button>
            <button onClick={() => {setActiveTab('customers'); setIsEditingProfile(false);}} className={`flex flex-col items-center justify-center p-2 rounded-xl ${activeTab === 'customers' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
              <Users className="w-5 h-5" />
              <span className="text-[10px] mt-0.5">Pelanggan</span>
            </button>
            <button onClick={() => {setActiveTab('ledger'); setIsEditingProfile(false);}} className={`flex flex-col items-center justify-center p-2 rounded-xl ${activeTab === 'ledger' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
              <BookOpen className="w-5 h-5" />
              <span className="text-[10px] mt-0.5">Buku Kas</span>
            </button>
            <button onClick={() => {setActiveTab('settings'); setEditProfile(currentUser); setShowPassword(false);}} className={`flex flex-col items-center justify-center p-2 rounded-xl ${activeTab === 'settings' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
              <Settings className="w-5 h-5" />
              <span className="text-[10px] mt-0.5">Profil</span>
            </button>
          </nav>

          {/* KONTEN UTAMA DIBATASI 1600px UNTUK LAYAR PC/TABLET */}
          <main className="flex-1 w-full max-w-[1600px] mx-auto pt-24 pb-24 lg:pb-12 px-2 sm:px-6 space-y-6 md:space-y-8">
            
            {/* DASHBOARD TAB (LEBAR KHUSUS DIPERKECIL MENJADI max-w-5xl) */}
            {activeTab === 'dashboard' && (
              <div className="max-w-5xl mx-auto space-y-6 md:space-y-8 px-2 sm:px-0">
                
                {/* Periode Aktif khusus Dashboard */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 md:p-5 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors shadow-sm">
                  <div className="flex items-center gap-4">
                    <h2 className="text-lg md:text-xl font-bold">Periode Aktif</h2>
                    <button onClick={() => setAlarmEnabled(!alarmEnabled)} className={`flex items-center gap-2 px-3 py-1.5 md:py-2 rounded-lg text-xs font-bold border transition-colors ${alarmEnabled ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/50' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}`}>
                      {alarmEnabled ? <Volume2 className="w-4 h-4"/> : <VolumeX className="w-4 h-4"/>} Alarm {alarmEnabled ? 'ON' : 'OFF'}
                    </button>
                  </div>
                  <div className="flex items-center gap-2">
                    <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none transition-colors">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                    <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Total Pelanggan</p><h3 className="text-3xl font-extrabold mt-1 md:mt-2">{customers.length}</h3><p className="text-xs md:text-sm text-emerald-600 dark:text-emerald-400 mt-2">{activeCustomersList.length} Aktif</p></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Potensi Omset</p><h3 className="text-2xl font-extrabold mt-1 md:mt-2">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Telah Terbayar</p><h3 className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1 md:mt-2">{formatIDR(actualPaidRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl font-extrabold mt-1 md:mt-2 ${netProfit >= 0 ? 'text-indigo-600 dark:text-indigo-400' : 'text-rose-600 dark:text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                {customersDueToday.length > 0 && (
                  <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-500/50 p-5 md:p-6 rounded-2xl shadow-[0_4px_20px_rgba(244,63,94,0.1)] transition-colors">
                    <div className="flex items-center gap-4">
                      <div className="p-3 bg-rose-200 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full animate-ring"><BellRing className="w-6 h-6"/></div>
                      <div><h3 className="text-lg font-bold text-rose-700 dark:text-rose-400">Peringatan Jatuh Tempo! (Tgl {todayDay})</h3><p className="text-sm text-slate-600 dark:text-slate-300 mt-1">Ada {customersDueToday.length} pelanggan yang harus ditagih hari ini.</p></div>
                    </div>
                  </div>

                    <div className="relative w-full sm:w-72">

                          <th className="py-2.5 px-3 md:py-4 md:px-6 bg-slate-50 dark:bg-slate-950">Jatuh Tempo</th>
                          <th className="py-2.5 px-3 md:py-4 md:px-6 text-left md:text-right bg-slate-50 dark:bg-slate-950">Aksi</th>

                              <td className="py-2.5 px-3 md:py-4 md:px-6">

                            </tr>
                          ))

                    </table>
                  </div>
                </div>
              </div>

                  {/* Grup 1: Periode Aktif */}

                    <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                  </div>

                  {/* Grup 2: Pencarian & Filter (Lebih Lentur/Memanjang Otomatis) */}

                    </div>
                    <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm md:text-base text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors w-full sm:w-auto">{BLOCKS.map(b => <option key={b}>{b}</option>)}</select>
                  </div>

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl transition-colors relative overflow-hidden">
                  {isDbLoading ? (

                    <div className="p-12 md:p-16 text-center text-rose-500 font-bold text-sm md:text-base">Data Pelanggan Kosong!</div>

                    <div className="overflow-x-auto overflow-y-auto max-h-[75vh] custom-scrollbar">
                      <table className="w-full text-left text-xs md:text-sm lg:text-base min-w-max md:min-w-[1300px]">

                          <tr>
                            <th className="py-2.5 px-3 md:py-4 md:px-6 w-32 md:w-56 bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400">Pelanggan</th>

                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {filteredCustomers.map(cust => (
                            <tr key={cust.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                              <td className="py-2 px-3 md:py-4 md:px-6">
                                <div className="font-semibold text-slate-800 dark:text-slate-100 text-sm md:text-base">{cust.name}</div>
                                <div className="font-bold text-indigo-600 dark:text-indigo-300 text-[10px] md:text-sm mt-0.5 md:mt-1">Blok {cust.block}</div>
                                <div className={`text-[8px] md:text-[10px] border px-1.5 py-0.5 md:px-2 md:py-1 rounded inline-block mt-1 ${cust.status === 'Aktif' ? 'text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/30 bg-emerald-100 dark:bg-emerald-500/10' : 'text-rose-700 dark:text-rose-400 border-rose-300 dark:border-rose-500/30 bg-rose-100 dark:bg-rose-500/10'}`}>{cust.status}</div>
                              </td>
                              <td className="py-2 px-2 md:py-4 md:px-4 text-[10px] md:text-sm">
                                <span className="font-medium text-slate-800 dark:text-slate-100">{getPackage(cust.packageId).speed}</span><br/>
                                <span className="text-slate-500 dark:text-slate-400">{formatIDR(getPackage(cust.packageId).price)}</span><br/>
                                <span className="text-amber-600 dark:text-amber-400 font-bold mt-1 inline-block">Tgl {cust.dueDate}</span>
                              </td>
                              
                              {MONTHS.map((m, i) => {
                                const monthKey = `${selectedYear}-${String(i + 1).padStart(2, '0')}`;
                                const isPaid = cust.payments && cust.payments[monthKey];
                                return (
                                  <td key={i} className="py-2 px-0 text-center">
                                    <button onClick={() => togglePayment(cust.id, monthKey)} className={`mx-auto w-6 h-6 md:w-8 md:h-8 rounded-md flex items-center justify-center border transition-all ${isPaid ? 'bg-emerald-100 dark:bg-emerald-500/20 border-emerald-500 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                                      {isPaid ? <Check className="w-3.5 h-3.5 md:w-5 md:h-5" strokeWidth={3} /> : <span className="text-[8px] md:text-xs">{i+1}</span>}
                                    </button>
                                  </td>
                                );
                              })}
                              
                              <td className="py-2 px-3 md:py-4 md:px-6 text-left md:text-right space-x-1 md:space-x-1.5 whitespace-nowrap">
                                <button onClick={() => toggleIsolirManual(cust)} className={`p-1.5 md:p-2 shadow-sm rounded-lg transition-colors ${cust.status === 'Aktif' ? 'bg-slate-100 dark:bg-slate-800 text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-900/30' : 'bg-rose-500 text-white hover:bg-emerald-500'}`} title={cust.status === 'Aktif' ? "Klik untuk Isolir Manual" : "Internet Terisolir (Klik untuk Aktifkan)"}>
                                  <Power className="w-4 h-4 md:w-5 md:h-5" />
                                </button>
                                <button onClick={() => triggerPrint(cust)} className="p-1.5 md:p-2 bg-slate-100 dark:bg-slate-800 rounded-lg hover:text-indigo-500 text-slate-500 shadow-sm transition-colors" title="Print Struk"><Printer className="w-4 h-4 md:w-5 md:h-5" /></button>
                                <button onClick={() => sendWAReceipt(cust, currentPeriodKey)} className="p-1.5 md:p-2 hover:text-emerald-500 text-slate-500 transition-colors" title="Kirim WA"><FileText className="w-4 h-4 md:w-5 md:h-5" /></button>
                                <button onClick={() => { setEditingCustomer(cust); setFormData({ ...cust, pppoe_user: cust.pppoe_user || '' }); setIsCustomerModalOpen(true); }} className="p-1.5 md:p-2 hover:text-indigo-500 text-slate-500 transition-colors" title="Edit"><Edit3 className="w-4 h-4 md:w-5 md:h-5" /></button>
                                <button onClick={() => handleDeleteCustomer(cust.id)} className="p-1.5 md:p-2 hover:text-rose-500 text-slate-500 transition-colors" title="Hapus"><Trash2 className="w-4 h-4 md:w-5 md:h-5" /></button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* LEDGER TAB */}
            {activeTab === 'ledger' && (
              <div className="space-y-6 md:space-y-8 px-2 sm:px-0 max-w-[1600px] mx-auto">

                    <h2 className="text-lg md:text-xl font-bold">Periode Aktif</h2>

                    <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                  </div>

                    <p className="text-[10px] md:text-xs uppercase font-bold text-slate-500">Pemasukan Bulan Ini</p>
                    <h3 className="text-xl md:text-2xl lg:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1 md:mt-2">{formatIDR(actualPaidRevenue)}</h3>
                  </div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 md:p-6 rounded-2xl shadow-sm">

                    <h3 className="text-xl md:text-2xl lg:text-3xl font-extrabold text-rose-600 dark:text-rose-400 mt-1 md:mt-2">{formatIDR(totalJurnal)}</h3>
                  </div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 md:p-6 rounded-2xl shadow-sm">
                    <p className="text-[10px] md:text-xs uppercase font-bold text-slate-500">Total Keluar (Fam)</p>
                    <h3 className="text-xl md:text-2xl lg:text-3xl font-extrabold text-rose-600 dark:text-rose-400 mt-1 md:mt-2">{formatIDR(totalFam)}</h3>
                  </div>
                  <div className={`border p-4 md:p-6 rounded-2xl shadow-sm ${netProfit >= 0 ? 'bg-indigo-50 dark:bg-indigo-950/30 border-indigo-200 dark:border-indigo-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 dark:border-rose-800'}`}>
                    <p className={`text-[10px] md:text-xs uppercase font-bold flex items-center gap-1.5 ${netProfit >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}><Wallet className="w-3 h-3 md:w-4 md:h-4"/> Total Uang (Sisa Kas)</p>
                    <h3 className={`text-xl md:text-2xl lg:text-3xl font-extrabold mt-1 md:mt-2 ${netProfit >= 0 ? 'text-indigo-700 dark:text-indigo-400' : 'text-rose-700 dark:text-rose-400'}`}>{formatIDR(netProfit)}</h3>
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 md:gap-6 bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors shadow-sm">
                  <div className="flex gap-2 border-b border-slate-200 dark:border-slate-700 w-full sm:w-auto">
                    <button onClick={() => setLedgerTab('Jurnal')} className={`px-4 md:px-6 py-2 md:py-3 text-sm md:text-base transition-all ${ledgerTab === 'Jurnal' ? 'border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Jurnal Umum</button>
                    <button onClick={() => setLedgerTab('Jurnal Fam')} className={`px-4 md:px-6 py-2 md:py-3 text-sm md:text-base transition-all ${ledgerTab === 'Jurnal Fam' ? 'border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Jurnal Fam</button>
                  </div>
                  <div className="flex gap-2 w-full sm:w-auto shrink-0 justify-end">
                    <button onClick={() => exportCSV('expenses')} className="flex-1 sm:flex-none px-4 py-2.5 md:py-3 bg-emerald-600 rounded-xl text-white text-sm md:text-base font-semibold shadow-lg hover:bg-emerald-700 flex items-center justify-center gap-2"><Download className="w-4 h-4 md:w-5 md:h-5"/> <span className="inline">Export</span></button>
                    <button onClick={() => { 
                      setEditingExpense(null);
                      setExpenseForm({ date: new Date().toISOString().split('T')[0], category: 'Belanja', description: '', notes: '', amount: '' }); 
                      setIsExpenseModalOpen(true); 
                    }} className="flex-1 sm:flex-none px-4 py-2.5 md:py-3 bg-rose-600 rounded-xl text-white text-sm md:text-base font-semibold flex justify-center gap-2 shadow-lg hover:bg-rose-700">
                      <Plus className="w-4 h-4 md:w-5 md:h-5"/> <span className="inline">Catat Kas</span>
                    </button>
                  </div>
                </div>
                
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-x-auto shadow-xl transition-colors">
                  <table className="w-full text-left text-xs md:text-sm lg:text-base min-w-[700px] md:min-w-full">
                    <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                      <tr>
                        <th className="py-3 px-4 md:py-4 md:px-6">Tanggal</th>
                        <th className="py-3 px-4 md:py-4 md:px-6">Kategori & Uraian</th>
                        <th className="py-3 px-4 md:py-4 md:px-6">Catatan</th>
                        <th className="py-3 px-4 md:py-4 md:px-6">Admin</th>
                        <th className="py-3 px-4 md:py-4 md:px-6 text-right">Nominal</th>
                        <th className="py-3 px-4 md:py-4 md:px-6 text-center w-20 md:w-28">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {displayedExpenses.length === 0 ? (

                            <td className="py-3 px-4 md:py-4 md:px-6 text-[10px] md:text-sm">{exp.admin}</td>
                            <td className="py-3 px-4 md:py-4 md:px-6 font-bold text-rose-600 dark:text-rose-400 text-right whitespace-nowrap">{formatIDR(exp.amount)}</td>
                            <td className="py-3 px-4 md:py-4 md:px-6 text-center whitespace-nowrap space-x-1">
                              <button onClick={() => { 
                                setEditingExpense(exp);
                                setExpenseForm({
                                  date: exp.date,
                                  category: exp.category,
                                  description: exp.description,
                                  notes: exp.notes || '',
                                  amount: exp.amount
                                });
                                setIsExpenseModalOpen(true);
                              }} className="p-1.5 md:p-2 text-slate-400 hover:text-indigo-500 transition-colors rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/30" title="Edit Pengeluaran">
                                <Edit3 className="w-4 h-4 md:w-5 md:h-5"/>
                              </button>
                              <button onClick={() => handleDeleteExpense(exp.id)} className="p-1.5 md:p-2 text-slate-400 hover:text-rose-500 transition-colors rounded-lg hover:bg-rose-50 dark:hover:bg-rose-900/30" title="Hapus Pengeluaran">
                                <Trash2 className="w-4 h-4 md:w-5 md:h-5"/>
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* SETTINGS TAB */}
            {activeTab === 'settings' && (
              <div className="flex flex-col lg:flex-row gap-6 md:gap-8 mx-auto items-start px-2 sm:px-0">
                
                <div className="w-full lg:w-[400px] shrink-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl transition-colors relative">
                  {!isEditingProfile ? (
                    <>
                      <button onClick={() => { setEditProfile(currentUser); setShowPassword(false); setIsEditingProfile(true); }} className="absolute top-6 right-6 md:top-8 md:right-8 p-2 md:p-2.5 bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-xl hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors" title="Edit Profil">
                        <Edit3 className="w-4 h-4 md:w-5 md:h-5" />
                      </button>
                      <h3 className="text-lg md:text-xl font-bold mb-6 md:mb-8 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><User className="w-5 h-5 md:w-6 md:h-6"/> Profil Saya</h3>
                      
                      <div className="flex items-center gap-4 md:gap-6 mb-6 md:mb-8">
                        <div className="w-20 h-20 md:w-24 md:h-24 rounded-full border-2 md:border-4 border-slate-200 dark:border-slate-700 overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0">
                          {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover" /> : <User className="w-8 h-8 md:w-10 md:h-10 text-slate-400" />}

                        <div>
                          <p className="font-bold text-lg md:text-xl text-slate-800 dark:text-slate-100 leading-tight">{currentUser.name}</p>
                          <p className="text-xs md:text-sm font-bold text-indigo-600 dark:text-indigo-400 uppercase mt-1 md:mt-2">{currentUser.role}</p>
                        </div>
                      </div>

                  <div>
                    <label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Kategori</label>
                    <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors">
                      <option>Belanja</option>
                      <option>Perbaikan/Pemasangan</option>
                      <option>Operasional</option>
                      <option>Fam</option>
                    </select>
                  </div>
                  
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Uraian / Deskripsi</label><input type="text" required value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Nominal (Rp)</label><input type="number" required value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div className="flex gap-3 md:gap-4 pt-4 md:pt-6 pb-2">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-2.5 md:py-3 border border-slate-300 dark:border-slate-700 rounded-xl font-bold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button>
                    <button type="submit" className="flex-1 py-2.5 md:py-3 bg-rose-600 text-white rounded-xl font-bold text-sm md:text-base hover:bg-rose-700 shadow-lg transition-colors">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDIT ADMIN LAIN OLEH ADMIN 1 - RESPONSIVE SCROLL */}
          {isTargetAdminModalOpen && targetAdmin && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-sm md:max-w-md p-6 md:p-8 shadow-2xl transition-colors relative max-h-[90vh] overflow-y-auto custom-scrollbar">
                <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><UserCog className="w-5 h-5 md:w-6 md:h-6"/> Edit {targetAdmin.role}</h3>
                <form onSubmit={handleSaveTargetAdmin} className="space-y-4 md:space-y-5">
                  <div className="flex items-center gap-4 md:gap-6 mb-4 md:mb-6">
                    <div className="relative w-16 h-16 md:w-20 md:h-20 rounded-full border-2 md:border-4 border-indigo-500 overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center group shrink-0">
                      {targetAdmin.photo ? <img src={targetAdmin.photo} className="w-full h-full object-cover" /> : <User className="w-6 h-6 md:w-8 md:h-8 text-slate-400" />}
                      <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity">
                        <Camera className="w-4 h-4 md:w-5 md:h-5 text-white" />
                        <input type="file" accept="image/*" onChange={(e) => handlePhotoUploadInit(e, true)} className="hidden" />
                      </label>
                    </div>
                    <div><p className="text-sm md:text-base font-semibold">Foto Profil</p><p className="text-[10px] md:text-xs text-slate-500 dark:text-slate-400 mt-0.5">Pilih foto & atur posisi.</p></div>
                  </div>
                  
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Nama Lengkap</label><input type="text" required value={targetAdmin.name} onChange={e => setTargetAdmin({...targetAdmin, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Username Login</label><input type="text" required value={targetAdmin.username} onChange={e => setTargetAdmin({...targetAdmin, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Password</label><input type="text" required value={targetAdmin.password} onChange={e => setTargetAdmin({...targetAdmin, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Email</label><input type="email" value={targetAdmin.email} onChange={e => setTargetAdmin({...targetAdmin, email: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">No WhatsApp</label><input type="text" value={targetAdmin.phone} onChange={e => setTargetAdmin({...targetAdmin, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>

                  <div className="flex gap-3 md:gap-4 pt-4 md:pt-6 pb-2">
                    <button type="button" onClick={() => setIsTargetAdminModalOpen(false)} className="flex-1 py-2.5 md:py-3 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button>
                    <button type="submit" className="flex-1 py-2.5 md:py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm md:text-base shadow-lg hover:bg-indigo-700 transition-colors">Simpan Data</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
