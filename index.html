    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '08999999977', email: 'hilman@mabunet.com', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin3', username: 'admin3', password: '123', name: 'Admin Teknisi', role: 'Teknisi & CS', phone: '081200000003', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' }

    function App() {
      const [admins, setAdmins] = useState(INITIAL_ADMINS);
      const [currentUser, setCurrentUser] = useState(null);
      
      const [loginForm, setLoginForm] = useState({ password: '' });
      const [loginError, setLoginError] = useState('');
      const [isScanning, setIsScanning] = useState(false);
      const [showPassword, setShowPassword] = useState(false); 
      const [forgotMode, setForgotMode] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotMessage, setForgotMessage] = useState({ text: '', type: '' });

      const [isDarkMode, setIsDarkMode] = useState(false); // Default Light Mode
      
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editProfile, setEditProfile] = useState({});
      const [isEditingProfile, setIsEditingProfile] = useState(false); 
      
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [targetAdmin, setTargetAdmin] = useState(null);
      const [isTargetAdminModalOpen, setIsTargetAdminModalOpen] = useState(false);
      
      // State Toggle Kelola Admin di Mobile/Desktop
      const [showAdminManagement, setShowAdminManagement] = useState(false);
      
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');
      const [dueSearchTerm, setDueSearchTerm] = useState(''); 

      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]); 
      // State untuk menyimpan konfigurasi (misalnya No. WhatsApp Gateway)
      const [settingsData, setSettingsData] = useState({ waGatewayPhone: '62811122699' }); 
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      const [printData, setPrintData] = useState(null);
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const [isBroadcasting, setIsBroadcasting] = useState(false); 
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      
      const [formData, setFormData] = useState({ name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '', pppoe_user: '' });
      const [expenseForm, setExpenseForm] = useState({ 
        date: new Date().toISOString().split('T')[0], category: 'Belanja', applicantSelect: 'Ayah', applicantCustom: '', description: '', amount: '' 
      });
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [editingExpense, setEditingExpense] = useState(null);

      const [cropState, setCropState] = useState({ isOpen: false, src: null, isTarget: false, zoom: 1, x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || { speed: 'Custom', price: 0 };
      const todayDay = new Date().getDate();

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const writeLog = async (actionDesc) => {
        if(!db || !currentUser) return;
        try { await addDoc(collection(db, 'logs'), { time: new Date().getTime(), dateStr: new Date().toLocaleString('id-ID'), admin: currentUser.name, action: actionDesc }); } catch(e) {}
      };

      useEffect(() => {
        if (!db) { setIsDbLoading(false); return; }
        try {
          const unsubAdmins = onSnapshot(collection(db, 'admins'), (snapshot) => {
            if (snapshot.empty) { INITIAL_ADMINS.forEach(async (adm) => { await setDoc(doc(db, 'admins', adm.id), adm); }); } 
            else {
              const cloudAdmins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAdmins(cloudAdmins);
              const sessionUid = localStorage.getItem('mabunet_session');
              setCurrentUser(prevUser => {
                const activeUid = prevUser ? prevUser.id : sessionUid;
                if (activeUid) {
                  const activeUser = cloudAdmins.find(a => a.id === activeUid);
                  if (activeUser && activeUser.status === 'Aktif') return activeUser;
                  else localStorage.removeItem('mabunet_session'); 
                } return null;
              });
            }
          });
          const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => (a.block || '').localeCompare(b.block || ''));
            setCustomers(data); setIsDbLoading(false);
          });
          const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => new Date(b.date) - new Date(a.date));
            setExpenses(data);
          });
          const unsubLogs = onSnapshot(collection(db, 'logs'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => b.time - a.time); setAuditLogs(data);
          });
          
          // Mengambil pengaturan khusus (misal No. WhatsApp Gateway Bot)
          const unsubSettings = onSnapshot(doc(db, 'settings', 'globalConfig'), (docSnapshot) => {
            if (docSnapshot.exists()) {
                setSettingsData(docSnapshot.data());
            } else {
                setDoc(doc(db, 'settings', 'globalConfig'), { waGatewayPhone: '62811122699' }); // Nilai Default
            }
          });
          return () => { unsubAdmins(); unsubCustomers(); unsubExpenses(); unsubLogs(); unsubSettings(); };
        } catch(e) { console.error(e); setIsDbLoading(false); }
      }, []);

      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
        writeLog(isPaid ? `Membatalkan lunas tagihan: ${cust.name}` : `Menandai LUNAS tagihan: ${cust.name}`);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { await updateDoc(doc(db, 'customers', editingCustomer.id), formData); writeLog(`Mengedit pelanggan: ${formData.name}`); } 
        else { await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); writeLog(`Menambah pelanggan: ${formData.name}`); }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        const finalApplicant = expenseForm.applicantSelect === 'Manual' ? expenseForm.applicantCustom : expenseForm.applicantSelect;
        const dataToSave = { date: expenseForm.date, category: expenseForm.category, applicant: finalApplicant, description: expenseForm.description, amount: expenseForm.amount, admin: currentUser.name };

        if (editingExpense) { await updateDoc(doc(db, 'expenses', editingExpense.id), dataToSave); writeLog(`Mengedit kas: ${formatIDR(expenseForm.amount)}`); } 
        else { await addDoc(collection(db, 'expenses'), dataToSave); writeLog(`Catat kas: ${formatIDR(expenseForm.amount)}`); }
        setIsExpenseModalOpen(false); setEditingExpense(null);
      };

      const handleDeleteCustomer = async (id) => {
        const cust = customers.find(c => c.id === id);
        if(confirm("Yakin hapus pelanggan ini?")) { await deleteDoc(doc(db, 'customers', id)); writeLog(`Menghapus pelanggan: ${cust.name}`); }
      };

      const handleDeleteExpense = async (id) => {
        if(confirm("Yakin hapus catatan pengeluaran ini?")) { await deleteDoc(doc(db, 'expenses', id)); writeLog(`Hapus pengeluaran ID: ${id}`); }
      };

      const toggleIsolirManual = async (cust) => {
        if(confirm(`Yakin ${cust.status === 'Aktif' ? 'ISOLIR' : 'AKTIFKAN'} internet pelanggan ${cust.name}?`)) {
          const newStatus = cust.status === 'Aktif' ? 'Non-Aktif' : 'Aktif';
          await updateDoc(doc(db, 'customers', cust.id), { status: newStatus });
          writeLog(`${newStatus} manual: ${cust.name}`);
        }
      };

      const handleLogin = (e) => {
        if(e) e.preventDefault(); setLoginError('');
        const user = admins.find(a => a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun dinonaktifkan.');
          setCurrentUser(user); setEditProfile(user);
          localStorage.setItem('mabunet_session', user.id); 
          localStorage.setItem('mabunet_device_user', user.id); 
        } else { setLoginError('Password salah!'); }
      };

      const registerFingerprint = async () => {
        try {
          if (!window.PublicKeyCredential) throw new Error("Perangkat tidak mendukung Fingerprint.");
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
          const pubKey = {
            challenge, rp: { name: "MABUNET", id: window.location.hostname },
            user: { id: userId, name: editProfile.username, displayName: editProfile.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000, attestation: "none"
          };
          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setEditProfile({...editProfile, credentialId: credentialId, fingerprintEnabled: true});
          alert("Sidik Jari terkait! Tekan 'Simpan Profil'.");
        } catch (err) { alert("Gagal mengaktifkan sidik jari."); }
      };

      const handleFingerprintScan = async () => {
        setIsScanning(true); setLoginError('');
        try {
          const savedUserId = localStorage.getItem('mabunet_device_user');
          if (!savedUserId) throw new Error('Perangkat belum dikenali. Login Manual dahulu.');
          const savedUser = admins.find(a => a.id === savedUserId);
          if (!savedUser || savedUser.status !== 'Aktif') throw new Error('Akun dinonaktifkan atau hilang.');
          if (!savedUser.fingerprintEnabled || !savedUser.credentialId) throw new Error('Sidik Jari belum diaktifkan.');
          
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const rawId = Uint8Array.from(atob(savedUser.credentialId), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required" }
          });
          if (assertion) { setCurrentUser(savedUser); setEditProfile(savedUser); localStorage.setItem('mabunet_session', savedUser.id); }
        } catch (err) { setLoginError(err.message || 'Verifikasi Sidik Jari gagal.'); } finally { setIsScanning(false); }
      };

      const handleForgotPassword = (e) => {
        e.preventDefault(); setForgotMessage({text: '', type: ''});
        const user = admins.find(a => (a.email || '').toLowerCase() === forgotEmail.toLowerCase() && a.email !== '');
        if (user) { setForgotMessage({text: `Akun ditemukan! Password Anda: ${user.password}`, type: 'success'}); } 
        else { setForgotMessage({text: 'Email tidak ditemukan di sistem database.', type: 'error'}); }
      };

      const handleLogout = () => { setCurrentUser(null); localStorage.removeItem('mabunet_session'); };

      const handleBroadcastWA = async () => {
        if (filteredDueCustomers.length === 0) return alert("Tidak ada tagihan yang belum lunas dalam daftar ini.");
        if (!confirm(`Kirim pesan otomatis ke ${filteredDueCustomers.length} pelanggan belum lunas?`)) return;
        setIsBroadcasting(true); let successCount = 0; let failedCount = 0;
        
        for (const cust of filteredDueCustomers) {
          if (!cust.phone) { failedCount++; continue; }
          try { await new Promise(resolve => setTimeout(resolve, 2000)); successCount++; } catch (err) { failedCount++; }
        }
        setIsBroadcasting(false); alert(`Broadcast Selesai!\n✅ Berhasil: ${successCount}\n❌ Gagal: ${failedCount}`);
      };

      const handlePhotoUploadInit = (e, isTargetAdmin = false) => {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onloadend = () => { setCropState({ isOpen: true, src: reader.result, isTarget: isTargetAdmin, zoom: 1, x: 0, y: 0 }); }; reader.readAsDataURL(file); }
        e.target.value = null; 
      };

      const handleCropDragStart = (e) => {
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setDragStart({ x: clientX - cropState.x, y: clientY - cropState.y });
      };
      const handleCropDragMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX; const
